<title>からだログ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=M+PLUS+Rounded+1c:wght@400;500;800&family=Quicksand:wght@500;700&display=swap">
<style>
/* Layout: phone diary column. Each role has its own shape: gradient hero, paper letter, cover cards for guides, fold-out rows for records, list rows for menus.
   Skins (ピンク / 水色 / 白 / 黒) set on <html data-skin>; every color is a token. */
:root{
  --bg:#FFF3F7; --surface:#FFFFFF; --sunk:#FFE9F1; --ink:#3B2532; --muted:#8A6979; --line:#F5D3E1;
  --accent:#FF5E9C; --accent-soft:#FFE0EC; --on-accent:#FFFFFF;
  --sub:#4EA9EC; --sub-soft:#E2F1FD; --mint:#3DBE97; --mint-soft:#DDF5EC;
  --lady:#A386E6; --lady-soft:#EFE8FD; --shadow:rgba(255,94,156,.16);
  --grad:linear-gradient(135deg,#FF9CC2 0%,#FFC9DD 48%,#B4DDFB 100%); --hero-ink:#3B2532;
  --round:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --latin:"Quicksand","M PLUS Rounded 1c",sans-serif;
  --script:"Cormorant Garamond","Times New Roman",serif;
  color-scheme:light;
}
:root[data-skin="blue"]{
  --bg:#EFF7FF; --surface:#FFFFFF; --sunk:#E3F0FD; --ink:#1F3142; --muted:#62798E; --line:#CDE4F7;
  --accent:#3A9FEA; --accent-soft:#DDEFFD; --on-accent:#FFFFFF;
  --sub:#FF6FA5; --sub-soft:#FFE6EF; --mint:#36B892; --mint-soft:#DAF3EA;
  --lady:#9A82E2; --lady-soft:#EDE8FC; --shadow:rgba(58,159,234,.16);
  --grad:linear-gradient(135deg,#8ACBF8 0%,#C3E5FC 50%,#FFCBDE 100%); --hero-ink:#1F3142; color-scheme:light}
:root[data-skin="white"]{
  --bg:#FAF9FA; --surface:#FFFFFF; --sunk:#F3F0F3; --ink:#232026; --muted:#76707A; --line:#E8E2E8;
  --accent:#EC6A9D; --accent-soft:#FCE6EF; --on-accent:#FFFFFF;
  --sub:#5BAFEA; --sub-soft:#E5F3FD; --mint:#3BB892; --mint-soft:#E0F5EE;
  --lady:#A08AE0; --lady-soft:#F0ECFC; --shadow:rgba(30,20,30,.07);
  --grad:linear-gradient(135deg,#FAD3E2 0%,#FFFFFF 50%,#D4EBFB 100%); --hero-ink:#232026; color-scheme:light}
:root[data-skin="black"]{
  --bg:#141016; --surface:#201A23; --sunk:#18131A; --ink:#F7EDF2; --muted:#B59CAA; --line:#3A2D37;
  --accent:#FF7EB3; --accent-soft:#3D2131; --on-accent:#1A0E14;
  --sub:#8FD0FF; --sub-soft:#1D2B37; --mint:#7DDFC0; --mint-soft:#1A302A;
  --lady:#C6AEFF; --lady-soft:#2D2440; --shadow:rgba(0,0,0,.45);
  --grad:linear-gradient(135deg,#5C2A44 0%,#3A2136 50%,#26324A 100%); --hero-ink:#F7EDF2; color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(130% 50% at 50% -10%,var(--accent-soft) 0%,transparent 70%);background-repeat:no-repeat;color:var(--ink);font-family:var(--round);font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
h1,h2,h3{font-family:var(--round);font-weight:800;line-height:1.4;text-wrap:balance;margin:0;letter-spacing:.02em}
h1{font-size:1.5rem}
h2{font-size:1.1rem}
h3{font-size:1rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.num{font-family:var(--latin);font-variant-numeric:tabular-nums}
.en{font-family:var(--script);font-style:italic;font-weight:500;letter-spacing:.02em;line-height:1.2}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:28px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 16px;padding:10px max(16px,env(safe-area-inset-left,0px))}
.bar-in{display:flex;align-items:center;gap:8px;max-width:560px;margin:0 auto}
.back{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);color:var(--accent);display:grid;place-items:center;font-size:1.2rem;line-height:1;box-shadow:0 2px 8px var(--shadow)}
.crumbs{display:flex;gap:4px;align-items:center;overflow-x:auto;white-space:nowrap;font-size:.8rem;min-width:0;scrollbar-width:none}
.crumbs::-webkit-scrollbar{display:none}
.crumbs button{background:none;border:0;padding:2px;color:var(--muted)}
.crumbs .sep{color:var(--accent);opacity:.6}
.crumbs .here{color:var(--ink);font-weight:800}
.banner{background:var(--sub-soft);border-radius:16px;padding:10px 14px;font-size:.85rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.warn{background:var(--accent-soft)}

/* buttons */
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 18px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:800;box-shadow:0 4px 12px var(--shadow)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 14px;font-size:.85rem}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:800;font-size:.85rem}
.heart{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:800;flex:none}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--accent);color:var(--on-accent);border:2px solid var(--surface);border-radius:999px;padding:12px 22px;font-weight:800;font-size:1rem;box-shadow:0 8px 22px var(--shadow)}

/* hero + letter */
.hero{background:var(--grad);color:var(--hero-ink);border-radius:30px;padding:22px 20px 20px;margin-top:10px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.hero::after{content:"✦";position:absolute;right:20px;top:14px;font-size:1.3rem;opacity:.55}
.hero::before{content:"♡";position:absolute;right:46px;top:40px;font-size:.9rem;opacity:.45}
.hero .en{font-size:1.15rem;opacity:.85}
.hero h1{font-size:1.55rem}
.hero .cheer{font-size:.95rem;opacity:.9}
.pill{align-self:flex-start;display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.75);color:#3B2532;border-radius:999px;padding:4px 12px;font-size:.82rem}
:root[data-skin="black"] .pill{background:rgba(0,0,0,.35);color:var(--ink)}
.pill b{color:var(--lady)}
.letter{background:var(--surface);border-radius:6px 26px 26px 26px;padding:18px 20px 16px;position:relative;box-shadow:0 8px 22px var(--shadow)}
.letter .from{display:flex;align-items:baseline;gap:8px;font-size:.8rem;font-weight:800;color:var(--accent)}
.letter .from .en{font-size:1rem}
.letter p{white-space:pre-wrap;margin-top:6px}
.letter .stamp{position:absolute;right:16px;top:-10px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:.85rem;box-shadow:0 3px 8px var(--shadow)}
.duo{display:grid;grid-template-columns:1fr auto;gap:10px}
.cta{display:flex;justify-content:space-between;align-items:center;text-align:left;border:0;border-radius:24px;padding:16px 18px;background:var(--accent);color:var(--on-accent);box-shadow:0 8px 20px var(--shadow)}
.cta b{font-size:1.1rem;font-weight:800;display:block}
.cta .lead{font-size:.8rem;opacity:.9}
.cta .arrow{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.28);display:grid;place-items:center;flex:none}
.cal-mini{width:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:var(--surface);border-radius:24px;padding:10px;box-shadow:0 4px 14px var(--shadow)}
.cal-mini .mo{font-size:.68rem;color:var(--accent);font-weight:800;letter-spacing:.1em}
.cal-mini .big{font-family:var(--latin);font-weight:700;font-size:1.8rem;line-height:1}
.cal-mini span:last-child{font-size:.7rem;color:var(--muted)}

/* carousel + pick cards */
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:4px max(16px,env(safe-area-inset-left,0px)) 10px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.pick{flex:none;width:68%;max-width:230px;scroll-snap-align:start;border-radius:24px;overflow:hidden;background:var(--surface);box-shadow:0 6px 18px var(--shadow);display:flex;flex-direction:column;text-align:left;border:0;padding:0}
.pick .cover{height:92px}
.pick .in{padding:10px 14px 14px;display:flex;flex-direction:column;gap:6px}
.pick b{font-weight:800}
.pick .t2{font-size:.76rem;color:var(--muted);line-height:1.5}
.cover{position:relative;display:grid;place-items:center;color:var(--ink)}
.cover .ico{width:38px;height:38px;stroke-width:1.5}
.cover .time{position:absolute;left:10px;top:10px;background:var(--surface);color:var(--ink);border-radius:999px;padding:0 9px;font-size:.72rem;font-weight:800}
.g-st{background:linear-gradient(140deg,color-mix(in srgb,var(--sub) 38%,var(--surface)),color-mix(in srgb,var(--sub) 12%,var(--surface)))}
.g-yoga{background:linear-gradient(140deg,color-mix(in srgb,var(--accent) 36%,var(--surface)),color-mix(in srgb,var(--accent) 10%,var(--surface)))}
.g-cardio{background:linear-gradient(140deg,color-mix(in srgb,var(--mint) 38%,var(--surface)),color-mix(in srgb,var(--mint) 12%,var(--surface)))}
.g-massage{background:linear-gradient(140deg,color-mix(in srgb,var(--lady) 38%,var(--surface)),color-mix(in srgb,var(--lady) 12%,var(--surface)))}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.badge{font-size:.68rem;border-radius:999px;padding:0 8px;background:var(--sunk);color:var(--ink);line-height:1.7}
.badge.lv1{background:var(--mint-soft);color:var(--mint)}
.badge.lv2{background:var(--sub-soft);color:var(--sub)}
.badge.lv3{background:var(--accent-soft);color:var(--accent)}

/* item rows */
.items{display:flex;flex-direction:column;gap:10px}
.irow{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:20px;padding:10px 12px 10px 10px;box-shadow:0 3px 10px var(--shadow)}
.irow .sq{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none}
.irow .sq .ico{width:26px;height:26px}
.irow .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left;border:0;background:none;padding:0}
.irow .mid b{font-weight:800}

/* weekly + numbers */
.yay{background:var(--surface);border-radius:26px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 14px var(--shadow)}
.yay-nums{display:flex;gap:10px}
.yay-num{flex:1;border-radius:20px;padding:10px 12px;text-align:center}
.yay-num:first-child{background:var(--accent-soft)}
.yay-num:last-child{background:var(--sub-soft)}
.yay-num b{display:block;font-family:var(--latin);font-size:1.8rem;line-height:1.1}
.yay-num:first-child b{color:var(--accent)}
.yay-num:last-child b{color:var(--sub)}
.yay-num span{font-size:.76rem}
.yay ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.yay li{display:flex;gap:8px;align-items:baseline;font-size:.9rem}
.yay li::before{content:"♡";color:var(--accent);flex:none}
.yay li span{color:var(--muted);font-size:.78rem;margin-left:auto;flex:none}
.rest{background:var(--sunk);border-radius:18px;padding:14px;text-align:center;font-size:.9rem}
.numbers{border:1.5px dashed var(--line);border-radius:22px;padding:12px 16px}
.numbers-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat{background:var(--surface);padding:10px 12px;min-width:0;border-radius:16px}
.stat .k{font-size:.74rem;color:var(--muted)}
.stat .v{font-family:var(--latin);font-size:1.45rem;font-weight:700;line-height:1.3}
.stat .v small{font-family:var(--round);font-size:.72rem;font-weight:500;color:var(--muted);margin-left:3px}
.stat .s{font-size:.74rem;color:var(--muted)}

/* guide */
.genres{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.genre{border:0;border-radius:22px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink)}
.genre .ico{width:30px;height:30px;stroke-width:1.6}
.genre b{font-weight:800;font-size:.95rem}
.genre span{font-size:.7rem;opacity:.75}
.cchips{display:flex;flex-wrap:wrap;gap:8px}
.cchip{border:0;border-radius:999px;padding:7px 14px;font-weight:800;font-size:.88rem;color:var(--ink)}
.c0{background:var(--accent-soft)}.c1{background:var(--sub-soft)}.c2{background:var(--mint-soft)}.c3{background:var(--lady-soft)}
.list-rows{display:flex;flex-direction:column;background:var(--surface);border-radius:22px;overflow:hidden;box-shadow:0 3px 10px var(--shadow)}
.list-rows button{display:flex;gap:12px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:13px 16px;width:100%}
.list-rows button:first-child{border-top:0}
.list-rows .lt{flex:1;min-width:0}
.list-rows small{color:var(--muted);font-size:.78rem;display:block;line-height:1.5}
.list-rows .arrow{color:var(--accent)}
.list-rows .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.big-cover{border-radius:28px;padding:22px 20px;display:flex;flex-direction:column;gap:8px;margin-top:4px}
.big-cover .ico{width:40px;height:40px;stroke-width:1.5}
.know{background:var(--surface);border-left:4px solid var(--accent);border-radius:6px 20px 20px 6px;padding:14px 16px;box-shadow:0 3px 10px var(--shadow)}
.know .eyebrow{color:var(--accent);font-weight:800;font-size:.78rem}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:flex;gap:10px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-family:var(--latin);font-weight:700;font-size:.85rem;display:grid;place-items:center;margin-top:1px}
.card-s{background:var(--surface);border-radius:22px;padding:16px;box-shadow:0 3px 10px var(--shadow)}
.prose{display:flex;flex-direction:column;gap:12px;max-width:65ch}
.prose h3{margin-top:6px}
.prose h3::before{content:"✦ ";color:var(--accent)}
.prose ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.prose li::marker{color:var(--accent)}
.term{border-top:1px solid var(--line);padding:12px 0;scroll-margin-top:80px}
.term:first-child{border-top:0}
.term b{font-weight:800}
.term .rel{font-size:.86rem;color:var(--muted);margin-top:4px}
.term.hl{background:var(--accent-soft);border-radius:12px;padding-inline:10px}
.tag{display:inline-block;font-size:.7rem;border-radius:999px;padding:0 9px;font-weight:800;line-height:1.8}
.tag.st{background:var(--sub-soft);color:var(--sub)}
.tag.yoga{background:var(--accent-soft);color:var(--accent)}
.tag.cardio{background:var(--mint-soft);color:var(--mint)}
.tag.massage{background:var(--lady-soft);color:var(--lady)}

/* record: fold-out rows */
.prog{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:8px 16px;box-shadow:0 3px 10px var(--shadow)}
.prog .dots{display:flex;gap:5px}
.prog .dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.prog .dots i.on{background:var(--accent)}
.prog span{font-size:.88rem}
.folds{display:flex;flex-direction:column;gap:10px}
.fold{background:var(--surface);border-radius:22px;box-shadow:0 3px 10px var(--shadow);overflow:hidden}
.fold-h{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:14px 16px}
.fold-h .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.fold-h .lt{flex:1;min-width:0}
.fold-h b{font-weight:800;display:block}
.fold-h small{display:block;font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold-h small.done{color:var(--accent)}
.fold-h .chev{color:var(--accent);transition:transform .15s}
.fold.open .fold-h .chev{transform:rotate(90deg)}
.fold-b{padding:2px 16px 16px;display:flex;flex-direction:column;gap:12px}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datenav h1{font-size:1.25rem}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.inp,select.inp,textarea.inp{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 12px;font-size:16px;line-height:1.55}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:4.6em}
.inp::placeholder{color:var(--muted);opacity:.7}
.unit{position:relative}
.unit .inp{padding-right:42px}
.unit em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-size:.82rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.out{font-size:.82rem;color:var(--sub);font-weight:500;min-height:1.3em}
.q{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--accent);background:var(--surface);font-size:.68rem;line-height:1;padding:0;color:var(--accent);display:inline-grid;place-items:center;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 13px;font-size:.84rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:800}
.chip.lady[aria-pressed="true"]{background:var(--lady);border-color:var(--lady)}
.entry{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0;padding-top:0}
.entry .body{flex:1;min-width:0}
.entry .body p{overflow-wrap:anywhere}
.x{flex:none;border:0;background:none;color:var(--muted);font-size:1.1rem;padding:0 4px}
.meal{display:flex;gap:8px;align-items:flex-start}
.meal .n{flex:none;width:48px;font-size:.8rem;color:var(--accent);font-weight:800;padding-top:10px}
.meal textarea{min-height:2.8em}
.addrow{display:flex;gap:6px;flex-wrap:wrap}
.exform{background:var(--sunk);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
details.more summary{cursor:pointer;color:var(--muted);font-size:.85rem}
details.more[open] summary{margin-bottom:10px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tog{flex:none;width:48px;height:28px;border-radius:999px;border:0;background:var(--line);position:relative;padding:0}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tog[aria-pressed="true"]{background:var(--accent)}
.tog[aria-pressed="true"]::after{left:23px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.okmsg{font-weight:800;color:var(--accent)}

/* settings panels */
.panel{background:var(--surface);border-radius:22px;padding:16px;box-shadow:0 3px 10px var(--shadow)}
.skins{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.skin{border:2px solid var(--line);border-radius:16px;padding:8px 4px 6px;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.78rem}

.seg{display:inline-flex;border-radius:999px;padding:3px;background:var(--sunk)}
.seg button{border:0;background:none;border-radius:999px;padding:4px 14px;font-size:.84rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);font-weight:800;box-shadow:0 1px 4px var(--shadow)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:.72rem;text-align:center;color:var(--muted);padding-bottom:2px}
.cal .wd:first-child{color:var(--accent)}
.cal .wd:last-child{color:var(--sub)}
.cell{border:1.5px solid transparent;background:var(--sunk);border-radius:12px;min-height:52px;padding:4px 3px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.cell .d{font-family:var(--latin);font-weight:700;font-size:.82rem;line-height:1.2}
.cell .marks{font-size:.62rem;line-height:1.1;display:flex;gap:2px}
.cell .marks .m{color:var(--lady)}
.cell .marks .h{color:var(--accent)}
.cell.out{background:transparent;color:var(--muted);opacity:.45}
.cell.today{border-color:var(--accent);background:var(--surface)}
.cell.per{background:var(--lady-soft)}
.cell.pred{border:1.5px dashed var(--lady)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.week{display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:56px 1fr;gap:10px;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 0;width:100%}
.wrow:first-child{border-top:0}
.wrow .dd b{display:block;font-family:var(--latin);font-size:1.15rem;line-height:1.2}
.wrow .dd span{font-size:.72rem;color:var(--muted)}
.wrow .sm{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;max-width:100%}
.chart text{fill:var(--muted);font-size:9px;font-family:var(--latin)}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(20,10,16,.35);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:26px 26px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:80vh;overflow-y:auto}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--surface);padding:8px 18px;border-radius:999px;font-size:.85rem;max-width:calc(100% - 32px);text-align:center}

/* onboarding */
.ob{padding-top:24px}
.ob .hero{padding:28px 22px}
.ob .logo .en{font-size:2.6rem;line-height:1}
.ob .logo .ja{font-weight:800;font-size:.9rem;letter-spacing:.2em;opacity:.75}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)};
const diffDays=(a,b)=>Math.round((parseKey(a)-parseKey(b))/864e5);
const W=['日','月','火','水','木','金','土'];
const fmtMD=k=>{const d=parseKey(k);return`${d.getMonth()+1}/${d.getDate()}`};

function todayKey(){return keyOf(new Date(Date.now()-(+S.settings.boundary||0)*36e5))}
function num(v){if(v==null)return null;const s=String(v).replace(/[０-９．]/g,c=>c==='．'?'.':String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[^\d.\-]/g,'');const n=parseFloat(s);return isFinite(n)?n:null}
const newDay=()=>({weight:'',fat:'',steps:'',temp:'',period:false,sizes:{},meals:[],ex:[],meds:[],medMemo:'',review:'',toYesterday:'',toTomorrow:''});

function bmi(w){const h=num(S.profile&&S.profile.height);if(!w||!h)return null;return w/((h/100)**2)}

/* レディースデイ */
function periodInfo(){
 const ks=sortedKeys().filter(k=>S.days[k].period);
 const starts=ks.filter(k=>!(S.days[addDays(k,-1)]||{}).period);
 const lens=starts.map(s=>{let n=0,k=s;while((S.days[k]||{}).period){n++;k=addDays(k,1)}return n});
 const cyc=[];for(let i=1;i<starts.length;i++){const d=diffDays(starts[i],starts[i-1]);if(d>=15&&d<=60)cyc.push(d)}
 const recent=cyc.slice(-6);
 const avg=recent.length?Math.round(recent.reduce((a,b)=>a+b,0)/recent.length):28;
 const ls=lens.slice(-6);const plen=ls.length?Math.max(3,Math.min(8,Math.round(ls.reduce((a,b)=>a+b,0)/ls.length))):5;
 const last=starts[starts.length-1]||null;
 let next=null;if(last){next=addDays(last,avg);const t=todayKey();while(diffDays(t,next)>plen)next=addDays(next,avg)}
 return{avg,plen,last,next,hasCycles:recent.length>0};
}
function predictedSet(){
 const set=new Set();if(!ladyOn()||!S.settings.periodPredict)return set;
 const p=periodInfo();if(!p.next)return set;
 for(let c=0;c<3;c++){const s=addDays(p.next,c*p.avg);for(let i=0;i<p.plen;i++){const k=addDays(s,i);if(!(S.days[k]||{}).period)set.add(k)}}
 return set;
}
function todayPicks(){

 const pick=(arr,o)=>arr[(seed+o)%arr.length];
 if(ladyOn()&&td&&td.period){return[...ITEMS.filter(i=>i.g==='yoga'&&i.t.includes(LD+'中')),ITEMS.find(i=>i.id==='walk')]}
 return[pick(ITEMS.filter(i=>i.g==='yoga'),0),pick(ITEMS.filter(i=>i.g==='st'&&i.lv===1),1),pick(ITEMS.filter(i=>i.g==='st'&&i.lv>1),2),pick(ITEMS.filter(i=>i.g==='cardio'),3)];
}

 if(td&&td.period){let n=0,k=t;while((S.days[k]||{}).period){n++;k=addDays(k,-1)}return`<span class="pill">☾ <b>${LD} ${n}日目</b> 今日はゆるめでOK</span>`}

/* 記録 */
function T(k){return GL[k]?`<button class="q" data-act="term" data-k="${k}" aria-label="${esc(GL[k].t)}とは">?</button>`:''}
function summaries(d){
 const body=[d.weight&&`${d.weight}kg`,d.steps&&`${(num(d.steps)||0).toLocaleString()}歩`,ladyOn()&&d.temp&&`${d.temp}℃`,ladyOn()&&d.period&&`☾ ${LD}`,Object.values(d.sizes||{}).some(Boolean)&&'サイズ'].filter(Boolean).join(' · ');
 const meals=d.meals.filter(m=>m.trim());
 const msgs=[d.review,d.toYesterday,d.toTomorrow].filter(x=>x&&x.trim()).length;
 return{body,meal:meals.length?`${meals.length}食 · ${meals[0]}`:'',ex:d.ex.map(e=>e.g==='massage'?`${e.part}ほぐし`:e.name).join('・'),med:[...d.meds,d.medMemo&&'メモ'].filter(Boolean).join('・'),msg:msgs?`${msgs}/3 書いた`:''};
}
function fold(id,ic,bg,title,sum,empty,inner){
 const open=ui.open===id;
 return`<section class="fold${open?' open':''}" id="s-${id}"><button class="fold-h" data-act="fold" data-id="${id}" aria-expanded="${open}"><span class="ic" style="background:${bg}">${icon(ic)}</span><span class="lt"><b>${title}</b><small class="${sum?'done':''}">${sum?'♡ '+esc(sum):empty}</small></span><span class="chev" aria-hidden="true">›</span></button>${open?`<div class="fold-b">${inner()}</div>`:''}</section>`;
}

 const d=S.days[k]||newDay();const t=todayKey();const i=phIdx(k);

 <div class="prog"><span class="dots">${[0,1,2,3,4].map(j=>`<i class="${j<n?'on':''}"></i>`).join('')}</span><span>${n?`${isToday?'今日':'この日'}は ${n}こ きろくできた ♡`:'書けるところだけ、1つでもOK'}</span></div>
 <div class="folds">
 ${fold('body','body','var(--sub-soft)','体',sm.body,'体重・歩数など',()=>`
  <div class="grid2">
   <div class="field"><label for="f-weight">体重</label><div class="unit"><input class="inp num" id="f-weight" data-f="weight" inputmode="decimal" value="${esc(d.weight)}"><em>kg</em></div></div>
   <div class="field"><label for="f-fat">体脂肪率（任意）</label><div class="unit"><input class="inp num" id="f-fat" data-f="fat" inputmode="decimal" value="${esc(d.fat)}"><em>%</em></div></div>
  </div>
  <div class="row"><span class="lbl">BMI ${T('bmi')}</span><span class="out num" id="o-bmi"></span><span class="lbl" style="margin-left:8px">除脂肪体重 ${T('lbm')}</span><span class="out num" id="o-lbm"></span></div>
  <div class="grid2">
   <div class="field"><label for="f-steps">歩数</label><div class="unit"><input class="inp num" id="f-steps" data-f="steps" inputmode="numeric" value="${esc(d.steps)}"><em>歩</em></div><span class="out" id="o-kcal"></span></div>
   ${ladyOn()?`<div class="field"><label for="f-temp">基礎体温 ${T('bbt')}</label><div class="unit"><input class="inp num" id="f-temp" data-f="temp" inputmode="decimal" placeholder="36.40" value="${esc(d.temp)}"><em>℃</em></div></div>`:''}
  </div>
  ${ladyOn()?`<div class="row"><span class="lbl">${LD}</span><button class="chip lady" data-act="period" aria-pressed="${!!d.period}">☾ ${d.period?LD+'中':LD+'中にする'}</button></div>`:''}
  <details class="more" ${Object.values(d.sizes||{}).some(Boolean)?'open':''}><summary>サイズも記録する（任意）</summary>
   <div class="grid2">${[['waist','ウエスト'],['hip','ヒップ'],['thigh','太もも'],['arm','二の腕']].map(([f,nm])=>`<div class="field"><label for="z-${f}">${nm}</label><div class="unit"><input class="inp num" id="z-${f}" data-size="${f}" inputmode="decimal" value="${esc((d.sizes||{})[f])}"><em>cm</em></div></div>`).join('')}</div>
  </details>`)}
 ${fold('meal','food','var(--accent-soft)','食べたもの',sm.meal,'食べた分だけ追加',()=>`
  ${d.meals.map((m,j)=>`<div class="meal"><span class="n">${j+1}食目</span><textarea class="inp" id="m-${j}" data-meal="${j}" rows="2" placeholder="${esc(PH.meal[(i+j)%3])}">${esc(m)}</textarea><button class="x" data-act="meal-del" data-i="${j}" aria-label="${j+1}食目を消す">×</button></div>`).join('')}
  <button class="btn" data-act="meal-add">＋ ${d.meals.length+1}食目</button>`)}
 ${fold('ex','st','var(--mint-soft)','運動・ほぐし',sm.ex,'ガイドの「やった」からも追加できるよ',()=>`
  ${d.ex.length?`<div>${d.ex.map((e,j)=>exLine(e,j)).join('')}</div>`:''}
  ${ui.exForm?exForm(ui.exForm):`<div class="addrow">${[['st','筋トレ'],['yoga','ヨガ'],['cardio','有酸素'],['massage','ほぐし']].map(([g,nm])=>`<button class="btn sm" data-act="ex-open" data-g="${g}">＋ ${nm}</button>`).join('')}</div>`}`)}
 ${fold('med','pill','var(--lady-soft)','薬・サプリ',sm.med,'名前をタグにしてタップで記録',()=>`
  ${S.meds.length?`<div class="chips">${S.meds.map(m=>`<button class="chip" data-act="med-toggle" data-name="${esc(m)}" aria-pressed="${d.meds.includes(m)}">${esc(m)}</button>`).join('')}</div>`:'<p class="small muted">名前を登録すると、飲んだ日をタップで記録できるよ。グラフに飲んでいた期間が重なって出る。</p>'}
  <div class="row"><input class="inp" id="medNew" placeholder="名前を登録" style="flex:1;min-width:0"><button class="btn sm" data-act="med-add">登録</button></div>
  <div class="field"><label for="f-medMemo">メモ（量・タイミング・変更など）</label><textarea class="inp" id="f-medMemo" data-f="medMemo" rows="2" placeholder="例：今日から量が変わった">${esc(d.medMemo)}</textarea></div>`)}
 ${fold('msg','letter','var(--sunk)','メッセージ',sm.msg,'今日の振り返り・昨日と明日の自分へ',()=>`
  <div class="field"><label for="f-review">今日の振り返り</label><textarea class="inp" id="f-review" data-f="review" rows="3" placeholder="${esc(PH.review[i])}">${esc(d.review)}</textarea></div>
  <div class="field"><label for="f-toYesterday">昨日の自分へ</label><textarea class="inp" id="f-toYesterday" data-f="toYesterday" rows="3" placeholder="${esc(PH.toYesterday[i])}">${esc(d.toYesterday)}</textarea></div>
  <div class="field"><label for="f-toTomorrow">明日の自分へ</label><textarea class="inp" id="f-toTomorrow" data-f="toTomorrow" rows="3" placeholder="${esc(PH.toTomorrow[i])}">${esc(d.toTomorrow)}</textarea><span class="small muted">明日のホームに届くよ</span></div>`)}
 </div>
 <p class="small muted" style="text-align:center">書いたそばから自動で保存されるよ</p>`;
}
function exLine(e,j){
 const tag={st:'筋トレ',yoga:'ヨガ',cardio:'有酸素',massage:'ほぐし'}[e.g];
 const head=e.g==='st'?`${esc(e.part)} · ${esc(e.name)}`:e.g==='massage'?`${esc(e.part)}${e.tool?` · ${esc(e.tool)}`:''}`:esc(e.name);
 const det=[e.weight,e.reps,e.amount].filter(Boolean).map(esc).join(' / ');
 return`<div class="entry"><span class="tag ${e.g}">${tag}</span><div class="body"><p><b>${head}</b>${det?` <span class="muted small">${det}</span>`:''}</p>${e.memo?`<p class="small muted">${esc(e.memo)}</p>`:''}</div><button class="x" data-act="ex-del" data-i="${j}" aria-label="消す">×</button></div>`;
}
function nameOptions(g,part){
 const base=ITEMS.filter(i=>i.g===g&&(g!=='st'||i.part===part)).map(i=>i.name);
 const cus=(S.custom[g]||[]).filter(c=>g!=='st'||c.part===part).map(c=>c.name).filter(n=>!base.includes(n));
 return[...base,...cus];
}

function updateDerived(k){
 const d=S.days[k]||newDay();const w=num(d.weight);const lf=latest('fat',k);const f=num(d.fat)??(lf?lf.v:null);
 const b=w?bmi(w):null;const o1=document.getElementById('o-bmi'),o2=document.getElementById('o-lbm'),o3=document.getElementById('o-kcal');
 if(o1)o1.textContent=b?b.toFixed(1):'—';
 if(o2)o2.textContent=(w&&f!=null)?`${(w*(1-f/100)).toFixed(1)}kg`:'—';
 const st=num(d.steps);const lw=latest('weight',k);const ww=w||(lw?lw.v:null);
 if(o3)o3.textContent=(st!=null&&ww)?`目安 約${kcal(ww,st)}kcal`:'';
}

/* カレンダー */
function vCalendar(){
 const t=todayKey();const mode=S.settings.calMode;const metric=ladyOn()?S.settings.calMetric:'weight';
 if(!ui.calCursor)ui.calCursor=t;
 const cd=parseKey(ui.calCursor);
 let range=[],title='';
 if(mode==='month'){const last=new Date(cd.getFullYear(),cd.getMonth()+1,0);for(let i=1;i<=last.getDate();i++)range.push(keyOf(new Date(cd.getFullYear(),cd.getMonth(),i)));title=`${cd.getFullYear()}年${cd.getMonth()+1}月`}
 else{const s0=addDays(ui.calCursor,-cd.getDay());for(let i=0;i<7;i++)range.push(addDays(s0,i));title=`${fmtMD(range[0])} 〜 ${fmtMD(range[6])}`}
 const pred=predictedSet();const lo=ladyOn();
 let grid='';
 if(mode==='month'){
  const lead=parseKey(range[0]).getDay();
  grid=`<div class="cal">${W.map(w=>`<div class="wd">${w}</div>`).join('')}${'<div></div>'.repeat(lead)}${range.map(k=>{const d=S.days[k];const per=lo&&d&&d.period;const cls=['cell',k===t?'today':'',per?'per':'',pred.has(k)?'pred':'',k>t?'out':''].join(' ');return`<button class="${cls}" data-act="cal-day" data-k="${k}" ${k>t?'disabled':''} aria-label="${fmtLong(k)}"><span class="d">${parseKey(k).getDate()}</span><span class="marks">${per?'<span class="m">☾</span>':''}${hasRecord(d)?'<span class="h">♡</span>':''}</span></button>`}).join('')}</div>`;
 }else{
  grid=`<div class="week">${range.map(k=>{const d=S.days[k];const per=lo&&d&&d.period;const parts=[];if(d){const m=d.meals.filter(x=>x.trim()).length;if(m)parts.push(`${m}食`);if(d.ex.length)parts.push(d.ex.map(e=>e.g==='massage'?'ほぐし':e.name).slice(0,2).join('・'))}
   return`<button class="wrow" data-act="cal-day" data-k="${k}" ${k>t?'disabled style="opacity:.45"':''}><span class="dd"><b>${parseKey(k).getDate()}</b><span>${W[parseKey(k).getDay()]}${k===t?' · 今日':''}</span></span><span style="min-width:0">${hasRecord(d)?'<span style="color:var(--accent)">♡</span> ':''}${per?`<span class="tag" style="background:var(--lady-soft);color:var(--lady)">☾ ${LD}</span> `:''}${pred.has(k)?'<span class="small muted">☾ 予定</span>':''}<span class="sm" style="display:block">${esc([parts.join(' · '),d&&d.review?d.review.split('\n')[0]:''].filter(Boolean).join(' ｜ '))||(d?'':'まだ記録なし')}</span></span></button>`}).join('')}</div>`;
 }
 return`<h1>カレンダー</h1>
 <section class="card-s stack"><div class="row" style="justify-content:space-between"><div class="seg" role="group" aria-label="表示">${[['week','週'],['month','月']].map(([v,n])=>`<button data-act="cal-mode" data-v="${v}" aria-pressed="${mode===v}">${n}</button>`).join('')}</div></div>
 <div class="datenav"><button class="back" data-act="cal-shift" data-n="-1" aria-label="前へ">‹</button><h2 class="num">${title}</h2><button class="back" data-act="cal-shift" data-n="1" aria-label="次へ">›</button></div>
 ${grid}
 <div class="legend"><span><span style="color:var(--accent)">♡</span> 記録した日</span>${lo?`<span><span style="color:var(--lady)">☾</span> ${LD}</span>${S.settings.periodPredict?`<span><i style="border:1px dashed var(--lady)"></i>予定</span>`:''}`:''}</div>
 <p class="small muted">日付をタップでその日を見返せるよ</p></section>
 <section class="card-s stack"><div class="row" style="justify-content:space-between"><h2>推移</h2>${lo?`<div class="seg" role="group" aria-label="表示する数値">${[['weight','体重'],['temp','基礎体温']].map(([v,n])=>`<button data-act="cal-metric" data-v="${v}" aria-pressed="${metric===v}">${n}</button>`).join('')}</div>`:''}</div>${ui.showChart?chart(range,metric)+`<button class="link" style="align-self:flex-start" data-act="chart-toggle">グラフをしまう</button>`:`<p class="small muted">グラフは見たいときだけ。体重は毎日ゆれるのが普通だから、1〜2週間の流れで見てね。</p><button class="btn sm" style="align-self:flex-start" data-act="chart-toggle">グラフをひらく</button>`}</section>`;
}
function chart(range,metric){
 const pts=range.map((k,i)=>{const d=S.days[k];const v=d?num(metric==='weight'?d.weight:d.temp):null;return{i,k,v}}).filter(p=>p.v!=null);
 const meds=[...new Set(range.flatMap(k=>(S.days[k]||{}).meds||[]))];
 const Wd=340,L=34,R=8,Tp=10,H=130,n=range.length;
 const xs=i=>L+(n===1?0:(i/(n-1))*(Wd-L-R));
 const bandH=16,total=Tp+H+20+meds.length*bandH+(meds.length?8:0);
 if(!pts.length)return`<p class="small muted">この期間の記録はまだないよ。</p>`;
 let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));
 const padv=metric==='weight'?0.5:0.1;lo-=padv;hi+=padv;if(hi-lo<(metric==='weight'?1:0.3)){const m=(hi+lo)/2;const s=metric==='weight'?0.5:0.15;lo=m-s;hi=m+s}
 const ys=v=>Tp+H-((v-lo)/(hi-lo))*H;
 const dx=n>1?(Wd-L-R)/(n-1):10;
 let g='';
 if(ladyOn())range.forEach((k,i)=>{if((S.days[k]||{}).period)g+=`<rect x="${xs(i)-dx/2}" y="${Tp}" width="${dx}" height="${H}" fill="var(--lady-soft)"/>`});
 [lo,(lo+hi)/2,hi].forEach(v=>{g+=`<line x1="${L}" x2="${Wd-R}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-4}" y="${ys(v)+3}" text-anchor="end">${metric==='weight'?v.toFixed(1):v.toFixed(2)}</text>`});
 const step=n>10?7:1;range.forEach((k,i)=>{if(i%step===0||i===n-1)g+=`<text x="${xs(i)}" y="${Tp+H+14}" text-anchor="middle">${fmtMD(k)}</text>`});
 g+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>`${xs(p.i)},${ys(p.v)}`).join(' ')}"/>`;
 pts.forEach((p,j)=>{g+=`<circle cx="${xs(p.i)}" cy="${ys(p.v)}" r="${j===pts.length-1?3.6:2}" fill="var(--accent)"/>`});
 meds.forEach((m,mi)=>{const y=Tp+H+26+mi*bandH;g+=`<text x="2" y="${y+8}">${esc(m.length>4?m.slice(0,4)+'…':m)}</text>`;range.forEach((k,i)=>{if(((S.days[k]||{}).meds||[]).includes(m))g+=`<rect x="${xs(i)-dx/2+0.5}" y="${y}" width="${Math.max(1,dx-1)}" height="10" rx="3" fill="var(--sub)" opacity=".6"/>`})});
 return`<div class="chart"><svg viewBox="0 0 ${Wd} ${total}" role="img" aria-label="${metric==='weight'?'体重':'基礎体温'}の推移">${g}</svg></div>${meds.length?'<p class="small muted">下の帯は薬・サプリを記録した日</p>':''}`;
}

/* シート・トースト */
function sheet(html){const r=document.getElementById('sheetRoot');r.innerHTML=html?`<div class="scrim" data-act="sheet-close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-in">${html}</div></div>`:''}
let tt;function toast(m){const e=document.getElementById('toast');e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2200)}
document.getElementById('sheetRoot').addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;if(a.dataset.act==='sheet-close')sheet('');if(a.dataset.act==='gloss'){sheet('');go('glossary',{k:a.dataset.k})}});

/* ===== サンプル ===== */
function rnd(i){const x=Math.sin(i*99.13+7)*10000;return x-Math.floor(x)}
function makeSample(){
 const s=blank();s.sample=true;s.profile={nick:'ゆめ',age:'24',height:'158',startWeight:'58.6'};
 s.meds=['サプリA（例）','薬B（例）'];s.settings.skin=S.settings.skin;
 S=s;const t=todayKey();
 const meals=['コンビニのおにぎり、ゆで卵','まかないの親子丼','サラダチキン、スープ','友だちと焼肉。楽しかった','プロテインとバナナ','パスタ半分、サラダ','カップスープ、ヨーグルト'];
 const revs=['寝る前のヨガができた。むくみがちょっと楽','歩数が少なかったけど、食事は落ち着いてた','仕事明けでも体重はかれた。それだけでえらい','食べすぎたけど楽しかったからOK。明日は歩く'];
 for(let n=0;n<=41;n++){
  const k=addDays(t,n-41);const d=newDay();const cyc=(n+25)%28;
  if(n%9!==4)d.weight=(58.6-n*0.028+Math.sin(n*1.3)*0.3+(cyc>=21?0.45:0)).toFixed(1);
  if(n%7!==3)d.temp=(cyc<14?36.22+rnd(n)*0.15:36.62+rnd(n)*0.15).toFixed(2);
  if(cyc<5)d.period=true;
  if(n%5!==2)d.steps=String(Math.round(3000+rnd(n+3)*8000));
  if(n%3!==1){const c=1+Math.floor(rnd(n+5)*3);for(let j=0;j<c;j++)d.meals.push(meals[(n+j*3)%meals.length])}
  if(n%4===0)d.ex.push({g:'st',part:'お尻',name:'ヒップリフト',weight:'自重',reps:'15回×3',memo:''});
  if(n%3===0)d.ex.push({g:'yoga',name:cyc<5?'チャイルドポーズ':'キャット＆カウ',memo:''});
  if(n%5===1)d.ex.push({g:'cardio',name:'ウォーキング',amount:'20分',memo:'仕事帰りに一駅'});
  if(n%6===2)d.ex.push({g:'massage',part:'ふくらはぎ',tool:'筋膜ローラー',memo:''});
  if(n>=8)d.meds.push('サプリA（例）');if(n>=24&&n%2===0)d.meds.push('薬B（例）');
  if(n%4===1)d.review=revs[n%revs.length];
  if(n===40){d.review='遅番明けだったけど、歩数がいつもより多かった';d.toTomorrow='起きたら水を一杯。寝る前に仰向けのねじりをやる';d.toYesterday='昨日より食べるペースがゆっくりになった'}
  if(n===41){d.meals=[];d.ex=[];d.review='';d.steps='2140';d.meds=['サプリA（例）']}
  S.days[k]=d;
 }
 return S;
}

/* ===== イベント ===== */
app.addEventListener('click',e=>{
 const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
 const r=cur();const dk=r.name==='record'?(r.p.date||todayKey()):todayKey();
 switch(act){
  case'go':go(a.dataset.r,a.dataset.p?JSON.parse(a.dataset.p):{});break;
  case'back':if(stack.length>1){stack.pop();ui.exForm=null;ui.confirm=null;ui.open=null;render();window.scrollTo(0,0)}break;
  case'crumb':stack=stack.slice(0,+a.dataset.i+1);ui.exForm=null;ui.open=null;render();window.scrollTo(0,0);break;
  case'date-shift':{const nk=addDays(dk,+a.dataset.n);if(nk>todayKey())break;r.p={...r.p,date:nk};ui.exForm=null;render();break}
  case'date-today':r.p={...r.p,date:todayKey()};render();break;
  case'fold':{const id=a.dataset.id;ui.open=ui.open===id?null:id;ui.exForm=null;render();if(ui.open){const el=document.getElementById('s-'+id);if(el&&el.scrollIntoView)el.scrollIntoView({block:'nearest'})}break}
  case'period':{const d=day(dk,true);d.period=!d.period;persist();render();break}
  case'meal-add':{const d=day(dk,true);d.meals.push('');persist();render();const el=document.getElementById('m-'+(d.meals.length-1));if(el)el.focus();break}
  case'meal-del':{const d=day(dk,true);d.meals.splice(+a.dataset.i,1);persist();render();break}
  case'ex-open':{const g=a.dataset.g;ui.exForm={g,part:g==='st'?PARTS[0]:g==='massage'?MPARTS[0]:'',name:g==='st'?nameOptions('st',PARTS[0])[0]:g==='massage'?'':nameOptions(g)[0],tool:'手'};render();break}
  case'ex-cancel':ui.exForm=null;render();break;
  case'ex-save':{const f=ui.exForm;const v=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
   const ent={g:f.g,memo:v('x-memo')};
   if(f.g==='massage'){ent.part=v('x-part');ent.tool=v('x-tool')==='なし・その他'?'':v('x-tool')}
   else{let nm=v('x-name');if(nm===FREE){nm=v('x-free');if(!nm){document.getElementById('x-free').focus();toast('名前を入れてね');break}
     const list=S.custom[f.g];const part=f.g==='st'?v('x-part'):undefined;if(!list.some(c=>c.name===nm&&(f.g!=='st'||c.part===part)))list.push(f.g==='st'?{part,name:nm}:{name:nm})}
    ent.name=nm;if(f.g==='st'){ent.part=v('x-part');ent.weight=v('x-weight');ent.reps=v('x-reps')}if(f.g==='cardio')ent.amount=v('x-amount')}
   day(dk,true).ex.push(ent);persist();ui.exForm=null;render();toast('追加したよ ♡');break}
  case'ex-del':{const d=day(dk,true);d.ex.splice(+a.dataset.i,1);persist();render();break}
  case'med-toggle':{const d=day(dk,true);const m=a.dataset.name;d.meds=d.meds.includes(m)?d.meds.filter(x=>x!==m):[...d.meds,m];persist();render();break}
  case'med-add':{const el=document.getElementById('medNew');const m=el.value.trim();if(!m)break;if(!S.meds.includes(m))S.meds.push(m);const d=day(dk,true);if(!d.meds.includes(m))d.meds.push(m);persist();render();toast(`「${m}」を登録したよ`);break}
  case'med-remove':S.meds=S.meds.filter(m=>m!==a.dataset.name);persist();render();break;
  case'term':{const g=GL[a.dataset.k];sheet(`<h2>${g.t}</h2><p>${g.one}</p><p class="small muted">${g.rel}</p><div class="row"><button class="btn sm" data-act="gloss" data-k="${a.dataset.k}">言葉の一覧で見る</button><button class="btn sm ghost" data-act="sheet-close">とじる</button></div>`);break}
  case'doit':{const it=ITEMS.find(i=>i.id===a.dataset.id);const ent={g:it.g,name:it.name,memo:''};if(it.g==='st'){ent.part=it.part;ent.weight='';ent.reps=''}day(todayKey(),true).ex.push(ent);persist();a.textContent='♡ やった！';toast(`「${it.name}」を今日の記録に入れたよ`);break}
  case'go-massage':go('record',{});ui.open='ex';ui.exForm={g:'massage',part:MPARTS[0],tool:'手'};render();break;
  case'cal-mode':S.settings.calMode=a.dataset.v;persist();render();break;
  case'cal-metric':S.settings.calMetric=a.dataset.v;persist();render();break;
  case'chart-toggle':ui.showChart=!ui.showChart;render();break;
  case'home-nums':S.settings.homeNumbers=!S.settings.homeNumbers;persist();render();break;
  case'cal-shift':{const c=parseKey(ui.calCursor||todayKey());if(S.settings.calMode==='month'){c.setDate(1);c.setMonth(c.getMonth()+ +a.dataset.n)}else c.setDate(c.getDate()+7*a.dataset.n);ui.calCursor=keyOf(c);render();break}
  case'cal-day':go('record',{date:a.dataset.k},2);break;
  case'set-tog':{const k=a.dataset.k;S.settings[k]=!S.settings[k];persist();render();break}
  case'set-lady':S.settings.periodRecord=a.dataset.v==='1';persist();render();break;
  case'skin':S.settings.skin=a.dataset.v;persist();if(!S.profile){applySkin();document.querySelectorAll('.skin').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===a.dataset.v)))}else render();break;
  case'bk-show':ui.backup=true;render();break;
  case'bk-hide':ui.backup=false;render();break;
  case'bk-copy':{const ta=document.getElementById('bk');const txt=ta.value;const fb=()=>{ta.select();toast('選択したので、長押しでコピーしてね')};try{navigator.clipboard.writeText(txt).then(()=>toast('コピーしたよ'),fb)}catch(err){fb()}break}
  case'imp-ask':{ui.importText=document.getElementById('imp').value;if(!ui.importText.trim()){document.getElementById('imp-msg').textContent='バックアップの文字を貼りつけるか、ファイルを選んでね';break}ui.confirm='import';render();break}
  case'imp-yes':{try{const d=JSON.parse(ui.importText);if(!d||!d.days||!d.settings)throw 0;S=Object.assign(blank(),d);S.settings=Object.assign(blank().settings,d.settings);S.custom=Object.assign({st:[],yoga:[],cardio:[]},d.custom||{});S.meds=d.meds||[];persist();ui.confirm=null;ui.importText='';render();toast('バックアップから戻したよ')}catch(err){ui.confirm=null;render();document.getElementById('imp-msg').textContent='読み込めなかったよ。バックアップの文字を最初から最後まで貼りつけてあるか確認してね'}break}
  case'conf-no':ui.confirm=null;render();break;
  case'wipe-ask':ui.confirm='wipe';render();break;
  case'wipe-yes':{const sk=S.settings.skin;S=blank();S.settings.skin=sk;persist();stack=[{name:'home',p:{},lv:0}];ui.confirm=null;render();break}
  case'sample-clear':{const sk=S.settings.skin;S=blank();S.settings.skin=sk;persist();stack=[{name:'home',p:{},lv:0}];render();window.scrollTo(0,0);break}
  case'ob-lady':{const on=a.dataset.v==='1';ui.obLady=on;document.querySelectorAll('[data-act="ob-lady"]').forEach(x=>x.setAttribute('aria-pressed',String((x.dataset.v==='1')===on)));document.getElementById('o-ppwrap').hidden=!on;break}
  case'ob-tog':a.setAttribute('aria-pressed',a.getAttribute('aria-pressed')==='true'?'false':'true');break;
  case'ob-start':{const g=id=>document.getElementById(id).value.trim();const h=num(g('o-h')),w=num(g('o-w'));
   if(!h||h<100||h>220){document.getElementById('o-err').textContent='身長をcmで入れてね（BMIの計算に使うよ）';break}
   if(!w||w<25||w>250){document.getElementById('o-err').textContent='はじめの体重をkgで入れてね';break}
   S.profile={nick:g('o-nick')||'わたし',age:g('o-age'),height:String(h),startWeight:String(w)};
   S.settings.periodRecord=ui.obLady;
   S.settings.periodPredict=document.getElementById('o-pp').getAttribute('aria-pressed')==='true';
   day(todayKey(),true).weight=String(w);persist();render();window.scrollTo(0,0);break}
  case'ob-sample':makeSample();persist();render();window.scrollTo(0,0);break;
 }
});
app.addEventListener('input',e=>{
 const el=e.target;const r=cur();const dk=r.name==='record'?(r.p.date||todayKey()):todayKey();
 if(el.dataset.f){day(dk,true)[el.dataset.f]=el.value;persist();updateDerived(dk)}
 else if(el.dataset.size){const d=day(dk,true);d.sizes=d.sizes||{};d.sizes[el.dataset.size]=el.value;persist()}
 else if(el.dataset.meal!=null){day(dk,true).meals[+el.dataset.meal]=el.value;persist()}
 else if(el.dataset.pf){S.profile[el.dataset.pf]=el.value;persist()}
 else if(el.id==='gq'){const q=el.value.trim().toLowerCase();document.querySelectorAll('.term').forEach(t=>t.hidden=!!q&&!t.dataset.s.includes(q));document.querySelectorAll('.gsec').forEach(s=>s.hidden=![...s.querySelectorAll('.term')].some(t=>!t.hidden))}
 else if(el.id==='imp'){ui.importText=el.value}
});
app.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.set==='boundary'){S.settings.boundary=+el.value;persist();toast('1日の区切りを変えたよ')}
 if(el.id==='x-part'&&ui.exForm&&ui.exForm.g==='st'){ui.exForm.part=el.value;const nm=document.getElementById('x-name');nm.innerHTML=opts([...nameOptions('st',el.value),FREE]);ui.exForm.name=nm.value;document.getElementById('x-freewrap').hidden=nm.value!==FREE}
 if(el.id==='x-name'&&ui.exForm){ui.exForm.name=el.value;document.getElementById('x-freewrap').hidden=el.value!==FREE}
 if(el.id==='x-part'&&ui.exForm&&ui.exForm.g==='massage')ui.exForm.part=el.value;
 if(el.id==='x-tool'&&ui.exForm)ui.exForm.tool=el.value;
 if(el.id==='impFile'&&el.files&&el.files[0]){const fr=new FileReader();fr.onload=()=>{ui.importText=String(fr.result);document.getElementById('imp').value=ui.importText;document.getElementById('imp-msg').textContent='ファイルを読み込んだよ。「読み込む」を押すと戻せる'};fr.readAsText(el.files[0])}
});
render();
